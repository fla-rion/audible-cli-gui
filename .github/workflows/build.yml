name: Build Windows & Linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg installieren (Chocolatey)
        run: choco install ffmpeg -y --no-progress

      - name: ffmpeg/ffprobe-Pfade ermitteln
        id: ffmpeg
        shell: pwsh
        run: |
          $ff = (Get-Command ffmpeg).Source
          $fp = (Get-Command ffprobe).Source
          echo "ffmpeg=$ff" >> $env:GITHUB_OUTPUT
          echo "ffprobe=$fp" >> $env:GITHUB_OUTPUT

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Windows-Icon erzeugen
        shell: python
        run: |
          from PIL import Image
          Image.open("icon.png").save(
              "icon.ico",
              sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)],
          )

      - name: Build mit PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --name "Audible Downloader"
          --icon icon.ico
          --add-data "templates;templates"
          --add-binary "${{ steps.ffmpeg.outputs.ffmpeg }};."
          --add-binary "${{ steps.ffmpeg.outputs.ffprobe }};."
          --hidden-import webview
          --hidden-import webview.platforms.edgechromium
          --hidden-import webview.platforms.winforms
          --hidden-import jinja2
          --hidden-import jinja2.ext
          --hidden-import flask
          --hidden-import flask.templating
          --hidden-import audible
          --hidden-import click
          --hidden-import rich
          --hidden-import httpx
          --hidden-import h11
          --hidden-import h2
          run_app.py

      - name: Smoke-Test (App startet, Flask antwortet)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist/Audible Downloader/Audible Downloader.exe" -PassThru `
            -RedirectStandardOutput "app-stdout.log" -RedirectStandardError "app-stderr.log"
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            if ($proc.HasExited) { break }
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:7842" -UseBasicParsing -TimeoutSec 2
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if ($proc.HasExited) {
            Write-Host "Prozess ist vorzeitig beendet (Exit-Code $($proc.ExitCode))"
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "--- stdout ---"; Get-Content "app-stdout.log" -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"; Get-Content "app-stderr.log" -ErrorAction SilentlyContinue
          if (-not $ok) {
            Write-Error "App hat nicht innerhalb von 30s auf Port 7842 geantwortet"
            exit 1
          }
          Write-Host "Smoke-Test OK"

      - name: Paketieren
        shell: pwsh
        run: Compress-Archive -Path "dist/Audible Downloader/*" -DestinationPath "AudibleDownloader-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: AudibleDownloader-windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build-Abhängigkeiten für QtWebEngine
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 xvfb

      - name: Statisches ffmpeg/ffprobe laden (keine Systemabhängigkeiten)
        run: |
          curl -L -o ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg.tar.xz
          mkdir -p ffmpeg-bin
          cp ffmpeg-*-linux64-gpl/bin/ffmpeg ffmpeg-bin/
          cp ffmpeg-*-linux64-gpl/bin/ffprobe ffmpeg-bin/
          chmod +x ffmpeg-bin/*
          ldd ffmpeg-bin/ffmpeg || true

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build mit PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --name "Audible Downloader"
          --add-data "templates:templates"
          --add-binary "ffmpeg-bin/ffmpeg:."
          --add-binary "ffmpeg-bin/ffprobe:."
          --collect-all PySide6
          --collect-all qtpy
          --hidden-import webview
          --hidden-import webview.platforms.qt
          --hidden-import qtpy.QtWebEngineWidgets
          --hidden-import jinja2
          --hidden-import jinja2.ext
          --hidden-import flask
          --hidden-import flask.templating
          --hidden-import audible
          --hidden-import click
          --hidden-import rich
          --hidden-import httpx
          --hidden-import h11
          --hidden-import h2
          run_app.py

      - name: Smoke-Test (App startet, Flask antwortet)
        run: |
          xvfb-run -a "dist/Audible Downloader/Audible Downloader" &
          ok=0
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://127.0.0.1:7842 >/dev/null; then
              ok=1
              break
            fi
          done
          pkill -f "Audible Downloader" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "App hat nicht innerhalb von 30s auf Port 7842 geantwortet"
            exit 1
          fi
          echo "Smoke-Test OK"

      - name: Paketieren
        run: tar -C dist -czf AudibleDownloader-linux-x64.tar.gz "Audible Downloader"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: AudibleDownloader-linux-x64.tar.gz

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-build/AudibleDownloader-windows-x64.zip
            artifacts/linux-build/AudibleDownloader-linux-x64.tar.gz
